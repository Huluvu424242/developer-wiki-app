name: kiagent-flutter-validation

on:
  push:

permissions:
  contents: read

concurrency:
  group: kiagent-flutter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        shell: bash
        run: |
          set +e
          dart format --set-exit-if-changed lib test
          format_exit=$?
          set -e
          if [ "$format_exit" -ne 0 ]; then
            echo "::group::Required formatting changes"
            git diff -- lib test
            echo "::endgroup::"
            exit "$format_exit"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
