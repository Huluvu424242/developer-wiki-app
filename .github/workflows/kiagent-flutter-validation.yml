name: kiagent-flutter-validation

on:
  push:

permissions:
  contents: read

concurrency:
  group: kiagent-flutter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        id: formatting
        shell: bash
        run: |
          set +e
          dart format --set-exit-if-changed lib test
          format_exit=$?
          set -e
          if [ "$format_exit" -ne 0 ]; then
            changed_files=$(git diff --name-only -- lib test)
            echo "::group::Required formatting changes"
            git diff -- lib test
            echo "::endgroup::"
            tar -czf /tmp/formatted-files.tgz $changed_files
            exit "$format_exit"
          fi

      - name: Export formatted baseline
        if: failure() && steps.formatting.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatted-baseline
          path: /tmp/formatted-files.tgz
          retention-days: 1
          if-no-files-found: error

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
