name: kiagent-quarterly-lifecycle-story

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron runs in UTC. The first day of Jan/Apr/Jul/Oct
    # provides the deterministic three-month cadence required by the harness.
    - cron: '17 6 1 1,4,7,10 *'

permissions:
  contents: read
  issues: write

concurrency:
  group: kiagent-quarterly-lifecycle-story
  cancel-in-progress: false

jobs:
  create-or-update-lifecycle-story:
    name: Create or update quarterly lifecycle story
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Show GitHub CLI version
        run: gh --version

      - name: Create lifecycle story or append quarterly reminder
        shell: bash
        run: |
          set -euo pipefail

          year="$(date -u +%Y)"
          month="$(date -u +%-m)"
          quarter="$(( (month - 1) / 3 + 1 ))"
          period="${year}-Q${quarter}"
          due_date="$(date -u +%F)"
          title="Lifecycle-Wartung ${period}"
          reminder_marker="<!-- kiagent-quarterly-lifecycle-reminder:${period} -->"

          echo "Lifecycle period: ${period}"
          echo "Due date: ${due_date}"

          open_issue="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=story&per_page=100" \
              --jq '.[] | select(.pull_request == null and (.title | startswith("Lifecycle-Wartung "))) | [.number, .html_url] | @tsv' \
              | sort -n \
              | sed -n '1p'
          )"

          if [[ -n "${open_issue}" ]]; then
            issue_number="${open_issue%%$'\t'*}"
            issue_url="${open_issue#*$'\t'}"

            echo "Open lifecycle story found: ${issue_url}"

            reminder_exists="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
                --jq ".[] | select(.body | contains(\"${reminder_marker}\")) | .html_url" \
                | sed -n '1p'
            )"

            if [[ -n "${reminder_exists}" ]]; then
              echo "Quarterly reminder already exists for ${period}: ${reminder_exists}"
              exit 0
            fi

            comment_file="$(mktemp)"
            trap 'rm -f "${comment_file}"' EXIT

            cat >"${comment_file}" <<'EOF'
          __REMINDER_MARKER__

          ## Weiterer Lifecycle-Wartungszeitpunkt fällig

          **Fällig am:** __DUE_DATE__  
          **Kalenderquartal:** __PERIOD__

          Diese Lifecycle-Story ist weiterhin offen. Deshalb wurde bewusst **keine neue parallele Lifecycle-Story** angelegt.

          Seit dem vorherigen Wartungszeitpunkt ist ein weiterer quartalsweiser Lifecycle-Check fällig geworden. Bei der Bearbeitung ist der inzwischen aktuelle `AGENTS.md` einschließlich der aktuellen `agent-rules/09-lifecycle-maintenance.md` erneut vollständig anzuwenden. Der konkrete Prüf- und Umsetzungsumfang ist aus diesem aktuellen Harness abzuleiten; dieser Kommentar enthält absichtlich keine kopierte technische Checkliste und keine festen Versionsstände.

          Der zusätzliche Wartungszeitpunkt erweitert den offenen Lifecycle-Auftrag um den inzwischen neu entstandenen Handlungsbedarf. Bestehende ältere Quartalshinweise bleiben als Audit-Trail erhalten.
          EOF

            sed -i \
              -e "s|__REMINDER_MARKER__|${reminder_marker}|g" \
              -e "s|__DUE_DATE__|${due_date}|g" \
              -e "s|__PERIOD__|${period}|g" \
              "${comment_file}"

            comment_url="$(
              gh issue comment "${issue_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --body-file "${comment_file}"
            )"

            echo "Added quarterly lifecycle reminder for ${period}: ${comment_url}"
            exit 0
          fi

          echo "No open lifecycle story found; creating ${title}."

          body_file="$(mktemp)"
          trap 'rm -f "${body_file}"' EXIT

          cat >"${body_file}" <<'EOF'
          <!-- kiagent-quarterly-lifecycle-story -->
          <!-- kiagent-quarterly-lifecycle-origin:__PERIOD__ -->

          ## Auftrag

          Führe die quartalsweise Lifecycle-Wartung für **__PERIOD__** vollständig aus.

          ## Verbindliche Quelle

          Der konkrete Prüf- und Umsetzungsumfang wird **nicht in dieser Story eingefroren**. Lies zu Beginn der Bearbeitung den dann aktuellen `AGENTS.md` auf dem Zielbranch sowie alle dort gelisteten Regelmodule vollständig.

          Für die Lifecycle-Wartung ist insbesondere die dann aktuelle Fassung von `agent-rules/09-lifecycle-maintenance.md` verbindlich. Sie ist die einzige normative Quelle für Rhythmus, Prüfumfang, Upgrade-Entscheidung und technische Mindestprüfungen. Bei einem Widerspruch zwischen dieser Story und dem aktuellen Harness gilt der aktuelle Harness.

          ## Arbeitsauftrag

          - Ermittle anhand des aktuellen Harness den für diesen Lauf tatsächlich erforderlichen Prüf- und Umsetzungsumfang.
          - Ermittle den aktuellen Projekt- und Toolchain-Stand sowie die aktuell unterstützten beziehungsweise vorgesehenen Zielstände.
          - Dokumentiere die Lifecycle-Entscheidung nachvollziehbar als `jetzt aktualisieren`, `gezielt aufschieben` oder `kein Handlungsbedarf`.
          - Bei `jetzt aktualisieren` setze den ermittelten Handlungsbedarf innerhalb dieses Lifecycle-Auftrags tatsächlich um und führe die vom **aktuellen** Harness verlangten Prüfungen durch.
          - Erfordern erkannte Änderungen nach spezielleren Repository-Regeln eine eigene Story oder einen separaten Pull Request, halte diese Trennung ein und verlinke die zugehörigen Arbeiten als Teil des Lifecycle-Batches.
          - Dokumentiere nicht ausführbare, bewusst aufgeschobene oder verbleibende Punkte mit Begründung, Auswirkung und geplantem Folgeschritt.

          ## Akzeptanzkriterien

          - [ ] Der aktuelle `AGENTS.md` und alle dort gelisteten Regelmodule wurden vor der Bearbeitung gelesen.
          - [ ] Die aktuelle `agent-rules/09-lifecycle-maintenance.md` wurde als verbindlicher Lifecycle-Vertrag angewendet.
          - [ ] Ist-Stand, relevante Zielstände und daraus abgeleiteter Handlungsbedarf wurden aktuell ermittelt und dokumentiert.
          - [ ] Die Lifecycle-Entscheidung wurde nachvollziehbar dokumentiert.
          - [ ] Erforderliche und nach der aktuellen Governance zulässige Änderungen wurden umgesetzt oder mit nachvollziehbarer Begründung gezielt aufgeschoben.
          - [ ] Die nach dem aktuellen Harness erforderlichen Prüfungen wurden ausgeführt beziehungsweise offen und transparent dokumentiert.
          - [ ] Erforderliche separate Stories/PRs aus speziellerer Governance wurden verlinkt.
          - [ ] Dokumentation und Changelog wurden soweit durch die tatsächlich vorgenommenen Änderungen erforderlich aktualisiert.

          > Diese Story enthält bewusst keine kopierte technische Lifecycle-Checkliste und keine festen Versionsnummern. Maßgeblich ist immer der aktuelle Harness zum Bearbeitungszeitpunkt. Bleibt sie über weitere Quartale offen, ergänzt die Automatisierung datierte Quartalshinweise statt paralleler Lifecycle-Stories.
          EOF

          sed -i "s/__PERIOD__/${period}/g" "${body_file}"

          issue_url="$(
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --label story \
              --body-file "${body_file}"
          )"

          echo "Created lifecycle story for ${period}: ${issue_url}"
