org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.47 supports AGP 9 with built-in Kotlin and the modern AGP DSL.
# Keep these explicit until Flutter no longer needs migration guards for AGP 9 projects.
android.builtInKotlin=true
android.newDsl=true
